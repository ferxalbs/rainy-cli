[package]
name = "rainy-cli"
version = "0.2.0"
edition = "2021"

description = "A premium AI-powered code assistant that helps developers analyze, generate, review, and chat about code."
license = "MIT"
repository = "https://github.com/your-org/rainy-cli"
keywords = ["cli", "ai", "developer-tools", "code-assistant", "agent"]

[dependencies]
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
rainy-sdk = "0.3.0"
colored = "2.0"
console = "0.15"
dialoguer = "0.10"
indicatif = "0.17"
dirs = "5.0"
miette = { version = "7.0", features = ["fancy"] }
thiserror = "1.0"
git2 = "0.18"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5.0"
diffy = "0.4.2"
regex = "1.10.2"
rmcp = "0.6.4"

[dev-dependencies]
tempfile = "3.3"

[[test]]
name = "tools"
path = "tests/tools.rs"
harness = true

[[test]]
name = "context"
path = "tests/context.rs"
harness = true
